<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElvasGuesser</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="core/style.css">
</head>
<body>
<div class="landing">
  <img src="icon-192.png" alt="" width="150" height="150" style="margin:0 auto;border-radius:1.6rem;box-shadow:0 .6rem 2rem #0008">
  <h1>ElvasGuesser</h1>
  <p class="muted">Mini jogos para jogar com amigos, cada um no seu telemóvel.</p>
  <div><a class="btn big" href="host.html">📺 Sou o anfitrião</a></div>
  <form id="f" style="display:grid;gap:.6rem;justify-items:center">
    <input class="field" id="room" maxlength="4" placeholder="CÓDIGO DA SALA" style="max-width:16rem;text-transform:uppercase" autocomplete="off">
    <button class="btn ghost" type="submit">📱 Entrar numa sala</button>
  </form>
</div>
<script>
document.getElementById("f").addEventListener("submit", (e) => {
  e.preventDefault();
  const c = document.getElementById("room").value.trim().toUpperCase();
  if (c) location.href = "play.html?room=" + encodeURIComponent(c);
});
</script>
</body>
</html>
